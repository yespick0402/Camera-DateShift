name: Windows / Mac 프로그램 만들기
on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            command: npm run build:windows
          - os: macos-latest
            name: mac-arm64
            command: npm run build:mac
    runs-on: ${{ matrix.os }}
    steps:
      - name: 소스 내려받기
        uses: actions/checkout@v4
      - name: Node 준비
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 패키지 설치
        run: npm install --no-audit --no-fund
      - name: 자동 테스트
        run: npm test
      - name: 프로그램 빌드
        run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: 다운로드 파일 올리기
        uses: actions/upload-artifact@v4
        with:
          name: Camera-DateShift-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 30
